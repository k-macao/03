# =====================================================================
# 📄 Deploy Report to Pages + 📲 WeChat Push  (整合版工作流 · 动态抓取双管线)
#
# 触发方式:
#   1. push 到 main            → 动态抓取行情+社区 → 动态建站 → 部署 Pages + 推送完整报告到微信
#   2. Actions 页面手动运行     → 同上, 可用 wechat_push 开关选择是否推送微信
#   3. 每天北京时间 09:00 定时   → 自动重建站点 + 推送完整报告到微信 (无需手动操作)
#
# 动态抓取管线 (每次运行均执行, 真正上线 — 行情+社区双动态):
#   market_data.py      → market_data.json      (Yahoo Finance / Stooq 多源回退抓取最新行情)
#   community_data.py   → community_data.json   (14 大社区 HTTP GET + 动态模板回退，每次刷新当天日期)
#   build_site.py       → report.html           (把行情+社区+抓取日期注入页面与推送内容)
#   wechat_push.py --embed                       (把最新推送负载内嵌进 report.html)
#   wechat_push.py --emit _site/wechat.json
#   wechat_push.py --push --scheduled            (推送前日期宽松校验, 单品行情/社区失败不阻断)
# =====================================================================
name: 📄 Deploy Report to Pages + 📲 WeChat Push

on:
  push:
    branches: [main]
  # ⏰ 每天北京时间 (UTC+8) 上午 09:00 自动推送 → 即 UTC 01:00
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      wechat_push:
        description: '推送完整报告到微信 (PushPlus)'
        type: boolean
        default: true
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------- 任务 1: 动态抓取 + 动态构建 + 部署到 GitHub Pages ----------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🌐 动态抓取行情 (market_data.py → market_data.json)
        run: python3 market_data.py

      - name: 🗣️ 动态抓取社区 (community_data.py → community_data.json · 14 源)
        run: python3 community_data.py

      - name: 🏗️ 动态构建报告 (build_site.py → report.html · 行情+社区双注入)
        run: python3 build_site.py

      - name: 🧩 内嵌微信推送负载 (wechat-parts → report.html)
        run: python3 tools/wechat_push.py --embed

      - name: 📁 准备部署目录
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          cp market_data.json _site/market_data.json
          cp community_data.json _site/community_data.json || echo "community_data.json not found, skip"

      - name: 🧩 生成微信推送内容 (wechat.json)
        run: python3 tools/wechat_push.py --emit _site/wechat.json

      - name: ⚙️ 配置 Pages
        uses: actions/configure-pages@v5

      - name: 📤 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------- 任务 2: 动态抓取 + 推送完整报告到微信 (push / 手动触发) ----------
  # 独立任务:Pages 部署成功后再推送;推送失败不影响网站部署状态
  # 每次运行先重新抓取行情+社区并重建报告, 确保推送内容永远是最新动态数据;
  # --scheduled 宽松校验: 抓取日期非当天仅警告不阻断, 单品行情/社区失败也不阻断推送。
  wechat:
    needs: deploy
    if: ${{ github.event_name == 'push' || inputs.wechat_push }}
    runs-on: ubuntu-latest
    env:
      # 可选:在仓库 Settings → Secrets 配置 PUSHPLUS_TOKEN 可覆盖
      # report.html 中的 token;不配置时自动从 report.html 读取
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🌐 动态抓取行情 (market_data.py)
        run: python3 market_data.py

      - name: 🗣️ 动态抓取社区 (community_data.py · 14 源)
        run: python3 community_data.py

      - name: 🏗️ 动态构建报告 (build_site.py · 行情+社区双注入)
        run: python3 build_site.py

      - name: 🧩 内嵌微信推送负载
        run: python3 tools/wechat_push.py --embed

      - name: 📲 推送完整报告到微信 (PushPlus)
        run: |
          set +e
          OUT=$(python3 tools/wechat_push.py --push --scheduled 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          {
            echo '### 📲 微信推送结果'
            echo '```text'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

  # ---------- 任务 3: 每天北京时间 09:00 定时自动抓取 + 重建 + 推送 ----------
  # 仅 schedule 触发时运行, 避免 push/手动触发时与 wechat 任务重复推送
  daily:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🌐 动态抓取行情 (market_data.py)
        run: python3 market_data.py

      - name: 🗣️ 动态抓取社区 (community_data.py · 14 源)
        run: python3 community_data.py

      - name: 🏗️ 动态构建报告 (build_site.py · 行情+社区双注入)
        run: python3 build_site.py

      - name: 🧩 内嵌微信推送负载
        run: python3 tools/wechat_push.py --embed

      - name: 🕘 每天 09:00 (北京时间) 定时推送完整报告到微信
        run: |
          set +e
          OUT=$(python3 tools/wechat_push.py --push --scheduled 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          {
            echo '### 🕘 定时微信推送结果'
            echo '```text'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE
