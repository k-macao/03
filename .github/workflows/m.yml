name: 📄 Deploy Report to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 📁 准备部署目录
        run: |
          mkdir -p _site
          cp report.html _site/index.html

      - name: ⚙️ 配置 Pages
        uses: actions/configure-pages@v5

      - name: 📤 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
